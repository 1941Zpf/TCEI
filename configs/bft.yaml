SUPER_CONFIG_PATH: ./configs/dancetrack.yaml

DATASETS: [BFT]
DATASET_SPLITS: [train]
INFERENCE_DATASET: BFT
INFERENCE_SPLIT: test

DETR_PRETRAIN: ./pretrains/r50_deformable_detr_coco_bft.pth
DETR_DEFAULT_CLASS_IDX: 15    # class 15 is "bird" in COCO

SAMPLE_LENGTHS: [20, ]
REL_PE_LENGTH: 20
MISS_TOLERANCE: 20

EPOCHS: 22
SCHEDULER_MILESTONES: [16, 20, ]
LR_WARMUP_EPOCHS: 2
SAVE_CHECKPOINT_PER_EPOCH: 2

USE_DECODER_CHECKPOINT: False


## For TCEI
POS_ENABLED: True
POS_SHOT_CAPACITY: 2
POS_ALPHA: 1.0
POS_BETA: 0.2

NEG_ENABLED: True
NEG_SHOT_CAPACITY: 2
NEG_ALPHA: 0.145
NEG_BETA: 1.0
NEG_ENTROPY_THRESHOLD_LOWER: 0.2
NEG_ENTROPY_THRESHOLD_UPPER: 0.5
NEG_MASK_THRESHOLD_LOWER: 0.03
NEG_MASK_THRESHOLD_UPPER: 1.0

POS_TEMPERATURE: 0.02
NEG_TEMPERATURE: 0.05

W_POS_ENABLED: True
W_POS_SHOT_CAPACITY: 12
W_POS_ALPHA: 1.0
W_POS_BETA: 3

W_NEG_ENABLED: True
W_NEG_SHOT_CAPACITY: 2
W_NEG_ALPHA: 0.150
W_NEG_BETA: 1.0
W_NEG_ENTROPY_THRESHOLD_LOWER: 0.1
W_NEG_ENTROPY_THRESHOLD_UPPER: 0.5
W_NEG_MASK_THRESHOLD_LOWER: 0.03
W_NEG_MASK_THRESHOLD_UPPER: 1.0

W_POS_TEMPERATURE: 0.02
W_NEG_TEMPERATURE: 0.05

# Lambda
USE_CACHE: object_and_id
LAMBDA_OBJECT: 1.0
LAMBDA_ID: 1.0